server:
  # 与 spring-ai 模块（默认 8080）错开，方便两个模块同时运行
  port: 8081

spring:
  application:
    name: spring-ai-mcp-server
  ai:
    mcp:
      server:
        enabled: true
        name: spring-ai-mcp-server
        version: 1.0.0
        instructions: "学习用 MCP Server：提供时间/日期、四则运算工具，示例资源与提示词模板。"
        type: SYNC
        protocol: STREAMABLE
        streamable-http:
          mcp-endpoint: /mcp
        # 工具调用超时
        request-timeout: 30s

logging:
  level:
    io.modelcontextprotocol: INFO
    org.springframework.ai.mcp: DEBUG
