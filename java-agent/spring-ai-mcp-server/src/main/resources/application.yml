server:
  # 与 spring-ai 模块（默认 8080）错开，方便两个模块同时运行
  port: 8081

spring:
  application:
    name: spring-ai-mcp-server
  ai:
    mcp:
      server:
        enabled: true
        name: spring-ai-mcp-server
        version: 1.0.0
        instructions: "学习用 MCP Server：提供时间/日期、四则运算工具，示例资源与提示词模板。"
        type: SYNC
        protocol: STREAMABLE
        streamable-http:
          mcp-endpoint: /mcp
        # 工具调用超时
        request-timeout: 30s
    openai:
      # 默认指向 OpenAI 官方，可改为任意 OpenAI 兼容接口（如 DeepSeek: https://api.deepseek.com）
      base-url: http://server.local.com:8317/v1
      api-key: ai-agent-learning
      chat:
        model: deepseek-flash
        reasoning-effort: none

logging:
  level:
    io.modelcontextprotocol: INFO
    org.springframework.ai.mcp: DEBUG
